# Automatic build and test run for every push to main and every pull request.
# Packaging and releases stay manual in build_release.yml.
name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PROJECT_DIR: AndroidFileSync
  APP_NAME: AndroidFileSync
jobs:
  build:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode_path=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version
      # Debug build for the runner's architecture only, then the unit tests
      # (AndroidFileSyncTests): this job checks the app, it ships nothing.
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_DIR/$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild.log
      # Logs need a GitHub sign-in to read; annotations and the job summary
      # make compiler errors visible from the run page and the API.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # The runner's bash template adds -e; turn it off so a grep with no
          # matches does not end the report early.
          set +e -uo pipefail
          test -f xcodebuild.log || exit 0
          # Compiler errors, failed assertions, and test-runner problems (a host
          # app that crashed or failed to launch reports no "error:" line).
          errors=$(grep -E '(: error: |^error: |\*\* (BUILD|TEST) FAILED \*\*|Testing failed|Test Case .* failed|[Cc]rashed|unexpected exit|Fatal error|failed to (load|launch)|Could not)' xcodebuild.log | sort -u | head -n 40)
          {
            echo "### Build and test errors"
            echo
            echo '```'
            printf '%s\n' "${errors:-No error lines found; see the xcodebuild-log artifact.}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$errors" | grep -E ': error: ' | while IFS= read -r line; do
            file="${line%%:*}"
            rest="${line#*:}"
            lineno="${rest%%:*}"
            message="${line#*: error: }"
            file="${file#"$GITHUB_WORKSPACE"/}"
            if [[ "$lineno" =~ ^[0-9]+$ ]]; then
              echo "::error file=${file},line=${lineno}::${message}"
            else
              echo "::error::${line}"
            fi
          done
          printf '%s\n' "$errors" | grep -vE ': error: ' | grep -v '^$' | while IFS= read -r line; do
            echo "::error::${line}"
          done
          # Failure messages from the test results (a crashed test is listed with
          # its crash message) and the top of the crashing thread from macOS's
          # crash reports, so crashes can be located without the log.
          xcresult=$(find build/DerivedData/Logs/Test -name '*.xcresult' -maxdepth 1 | head -n 1)
          if [[ -n "$xcresult" ]]; then
            xcrun xcresulttool get test-results summary --path "$xcresult" --format json 2>/dev/null \
              | python3 -c 'import json,sys
          d = json.load(sys.stdin)
          for f in d.get("testFailures", [])[:10]:
              text = (f.get("testIdentifierString", "") + ": " + f.get("failureText", "")).replace("%", "%25").replace("\n", "%0A")
              print("::error title=Test failure::" + text[:3000])' || true
          fi
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/AndroidFileSync*.ips 2>/dev/null | head -n 2); do
            python3 - "$report" <<'PY' || true
          import json, sys
          lines = open(sys.argv[1]).read().split("\n", 1)
          body = json.loads(lines[1])
          exc = body.get("exception", {})
          out = ["Exception: %s %s" % (exc.get("type", ""), exc.get("signal", ""))]
          term = body.get("termination", {}).get("indicator")
          if term: out.append("Termination: " + term)
          for t in body.get("threads", []):
              if t.get("triggered"):
                  images = body.get("usedImages", [])
                  for fr in t.get("frames", [])[:25]:
                      img = images[fr["imageIndex"]].get("name", "?") if fr.get("imageIndex") is not None and fr["imageIndex"] < len(images) else "?"
                      out.append("%s  %s" % (img, fr.get("symbol", hex(fr.get("imageOffset", 0)))))
          msg = "%0A".join(x.replace("%", "%25") for x in out)
          print("::error title=Crash report " + sys.argv[1].split("/")[-1] + "::" + msg[:8000])
          PY
          done
          # The end of the log usually explains a failure the patterns missed.
          tail_text=$(tail -n 25 xcodebuild.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Last lines of the xcodebuild log::${tail_text}"
          exit 0
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
