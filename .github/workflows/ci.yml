# Automatic build and test run for every push to main and every pull request.
# Packaging and releases stay manual in build_release.yml.
name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PROJECT_DIR: AndroidFileSync
  APP_NAME: AndroidFileSync
jobs:
  build:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26 toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode_path=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' -print | sort | tail -n 1)
          test -n "$xcode_path"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version
      # Debug build for the runner's architecture only, then the unit tests
      # (AndroidFileSyncTests): this job checks the app, it ships nothing.
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_DIR/$APP_NAME.xcodeproj" \
            -scheme "$APP_NAME" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild.log
      # Logs need a GitHub sign-in to read; annotations and the job summary
      # make compiler errors visible from the run page and the API.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # The runner's bash template adds -e; turn it off so a grep with no
          # matches does not end the report early.
          set +e -uo pipefail
          test -f xcodebuild.log || exit 0
          errors=$(grep -E '(: error: |^error: |\*\* (BUILD|TEST) FAILED \*\*)' xcodebuild.log | sort -u | head -n 40)
          {
            echo "### Build and test errors"
            echo
            echo '```'
            printf '%s\n' "${errors:-No error lines found; see the xcodebuild-log artifact.}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$errors" | grep -E ': error: ' | while IFS= read -r line; do
            file="${line%%:*}"
            rest="${line#*:}"
            lineno="${rest%%:*}"
            message="${line#*: error: }"
            file="${file#"$GITHUB_WORKSPACE"/}"
            if [[ "$lineno" =~ ^[0-9]+$ ]]; then
              echo "::error file=${file},line=${lineno}::${message}"
            else
              echo "::error::${line}"
            fi
          done
          printf '%s\n' "$errors" | grep -E '^error: ' | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
